<style>
  :root{--bord:#1C3D3A;--bord2:#244D49;--cream:#F4ECDD;--gold:#C19A6B;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bord);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header{padding:24px 0 6px;text-align:center}
  .kicker{font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;font-weight:600}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:50px;line-height:1;margin-top:4px;letter-spacing:-1px}
  h1 em{color:var(--gold);font-style:normal}
  .sub{color:#D9C9B0;font-size:14px;margin-top:9px;line-height:1.5}
  .picker-t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:16px 2px 10px}
  .cities{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
  .chip{border:1px solid rgba(244,236,221,.22);background:transparent;color:var(--cream);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip .flag{margin-right:5px}
  .chip.active{background:var(--cream);color:var(--bord);border-color:var(--cream)}
  .card{background:linear-gradient(165deg,#244D49,#142E2B);border:1px solid rgba(193,154,107,.25);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .city-name{font-family:Georgia,serif;font-size:26px;font-weight:700}
  .city-tag{font-size:13px;color:var(--gold);font-style:italic;margin-top:2px}
  .rbadge{font-size:11px;color:#B89B86;letter-spacing:.03em;margin-top:6px}
  .rbadge.real{color:#86c79d}
  .section-t{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 12px}
  ol.top{list-style:none}
  ol.top li{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(244,236,221,.08)}
  ol.top li:last-child{border-bottom:none}
  .rank{font-family:Georgia,serif;font-size:19px;color:var(--gold);width:22px;text-align:center;font-weight:700}
  .wname{flex:1;font-size:15px;font-weight:600}
  .ltrack{width:84px;height:8px;background:rgba(0,0,0,.3);border-radius:5px;overflow:hidden}
  .lfill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),#e6c9a0)}
  .pct{width:32px;text-align:right;font-size:13px;color:#E7D7BE;font-variant-numeric:tabular-nums}
  footer{text-align:center;color:#B89B86;font-size:12px;margin-top:8px;line-height:1.6}
  .install{margin-top:14px;background:rgba(0,0,0,.2);border:1px dashed rgba(193,154,107,.45);border-radius:14px;padding:14px 16px;font-size:13px;color:#E7D7BE;line-height:1.55}
  .install b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wrap<em>Wines</em></h1>
    <p class="sub">Le Wrapped planétaire du vin · D'après l'intérêt de recherche, pays par pays.</p>
  </header>
  <div class="picker-t">Choisis un pays · 20</div>
  <div class="cities" id="cities"></div>
  <div id="view"></div>
  <footer>WrapWines · prototype · 20 pays</footer>
</div>
<script>
const DATA={"france": {"flag": "🇫🇷", "name": "France", "tag": "Le berceau des grands vins", "top": [["Bordeaux", 100], ["Champagne", 88], ["Bourgogne", 80], ["Côtes du Rhône", 64], ["Sancerre", 52]]}, "italie": {"flag": "🇮🇹", "name": "Italie", "tag": "Terre de mille cépages", "top": [["Prosecco", 100], ["Chianti", 90], ["Barolo", 78], ["Amarone", 66], ["Brunello", 55]]}, "espagne": {"flag": "🇪🇸", "name": "Espagne", "tag": "Le royaume du Tempranillo", "top": [["Rioja", 100], ["Ribera del Duero", 84], ["Cava", 76], ["Albariño", 60], ["Priorat", 50]]}, "usa": {"flag": "🇺🇸", "name": "États-Unis", "tag": "Puissance du Nouveau Monde", "top": [["Napa Cabernet", 100], ["Chardonnay", 82], ["Pinot Noir", 74], ["Zinfandel", 58], ["Prosecco", 52]]}, "royaumeuni": {"flag": "🇬🇧", "name": "Royaume-Uni", "tag": "Le grand importateur", "top": [["Bordeaux", 100], ["Champagne", 86], ["Rioja", 72], ["Prosecco", 70], ["Porto", 58]]}, "allemagne": {"flag": "🇩🇪", "name": "Allemagne", "tag": "La patrie du Riesling", "top": [["Riesling", 100], ["Spätburgunder", 72], ["Sekt", 60], ["Grauburgunder", 55], ["Champagne", 48]]}, "portugal": {"flag": "🇵🇹", "name": "Portugal", "tag": "Trésors de l'Atlantique", "top": [["Porto", 100], ["Vinho Verde", 84], ["Douro", 78], ["Alentejo", 64], ["Madère", 46]]}, "autriche": {"flag": "🇦🇹", "name": "Autriche", "tag": "Le pays du Grüner", "top": [["Grüner Veltliner", 100], ["Riesling", 76], ["Blaufränkisch", 64], ["Zweigelt", 56], ["Sekt", 48]]}, "argentine": {"flag": "🇦🇷", "name": "Argentine", "tag": "L'empire du Malbec", "top": [["Malbec", 100], ["Cabernet Franc", 70], ["Torrontés", 60], ["Bonarda", 50], ["Cabernet Sauvignon", 46]]}, "chili": {"flag": "🇨🇱", "name": "Chili", "tag": "La vallée andine", "top": [["Cabernet Sauvignon", 100], ["Carmenère", 86], ["Sauvignon Blanc", 70], ["Merlot", 60], ["Syrah", 50]]}, "australie": {"flag": "🇦🇺", "name": "Australie", "tag": "Le Shiraz roi", "top": [["Shiraz", 100], ["Chardonnay", 78], ["Cabernet Sauvignon", 70], ["Riesling", 56], ["Pinot Noir", 52]]}, "nouvellezelande": {"flag": "🇳🇿", "name": "Nouvelle-Zélande", "tag": "Sauvignon du bout du monde", "top": [["Sauvignon Blanc", 100], ["Pinot Noir", 80], ["Chardonnay", 62], ["Syrah", 48], ["Riesling", 44]]}, "afriquedusud": {"flag": "🇿🇦", "name": "Afrique du Sud", "tag": "Le Cap audacieux", "top": [["Pinotage", 100], ["Chenin Blanc", 84], ["Cabernet Sauvignon", 70], ["Chardonnay", 58], ["Cap Classique", 50]]}, "japon": {"flag": "🇯🇵", "name": "Japon", "tag": "L'élégance importée", "top": [["Bordeaux", 100], ["Bourgogne", 90], ["Champagne", 82], ["Koshu", 66], ["Riesling", 50]]}, "belgique": {"flag": "🇧🇪", "name": "Belgique", "tag": "", "top": [["Bordeaux", 100], ["Champagne", 86], ["Bourgogne", 74], ["Côtes du Rhône", 60], ["Chianti", 50]]}, "canada": {"flag": "🇨🇦", "name": "Canada", "tag": "Le froid qui sublime", "top": [["Icewine", 100], ["Riesling", 80], ["Pinot Noir", 70], ["Cabernet Sauvignon", 60], ["Chardonnay", 54]]}, "bresil": {"flag": "🇧🇷", "name": "Brésil", "tag": "Le Sud tropical", "top": [["Espumante", 100], ["Malbec", 78], ["Cabernet Sauvignon", 66], ["Merlot", 58], ["Chardonnay", 48]]}, "paysbas": {"flag": "🇳🇱", "name": "Pays-Bas", "tag": "Carrefour curieux", "top": [["Bordeaux", 100], ["Prosecco", 82], ["Rioja", 72], ["Bourgogne", 64], ["Champagne", 56]]}, "suisse": {"flag": "🇨🇭", "name": "Suisse", "tag": "Précision alpine", "top": [["Chasselas", 100], ["Pinot Noir", 84], ["Bordeaux", 74], ["Merlot", 60], ["Champagne", 52]]}, "coreedusud": {"flag": "🇰🇷", "name": "Corée du Sud", "tag": "La nouvelle vague", "top": [["Bourgogne", 100], ["Champagne", 82], ["Bordeaux", 74], ["Riesling", 56], ["Prosecco", 50]]}};
const order=["france", "italie", "espagne", "usa", "royaumeuni", "allemagne", "portugal", "autriche", "argentine", "chili", "australie", "nouvellezelande", "afriquedusud", "japon", "belgique", "canada", "bresil", "paysbas", "suisse", "coreedusud"];
let current=order[0];
let TRENDS=null;
function renderChips(){
  const c=document.getElementById("cities");
  c.innerHTML=order.map(k=>{const d=DATA[k];
    return `<button class="chip ${k===current?'active':''}" data-k="${k}"><span class="flag">${d.flag}</span>${d.name}</button>`;}).join("");
  c.querySelectorAll(".chip").forEach(b=>{b.onclick=()=>{current=b.dataset.k;renderChips();renderView();
    document.getElementById("view").scrollIntoView({behavior:"smooth",block:"start"});};});
}
function renderView(){
  const d=DATA[current];
  const r=(TRENDS&&TRENDS.countries&&TRENDS.countries[current])||null;
  let badge, items;
  if(r&&r.top&&r.top.length){items=r.top;badge=`<div class="rbadge real">● Données réelles · Google Trends · ${TRENDS.updated||''}</div>`;}
  else{items=d.top;badge="";}
  items=items.filter(t=>String(t[0]).toLowerCase()!=='champagne').slice(0,5);
  const max=(items[0]&&items[0][1])||100;
  const list=items.map((t,i)=>`<li><span class="rank">${i+1}</span><span class="wname">${t[0]}</span><span class="ltrack"><span class="lfill" style="width:${Math.max(6,Math.round(t[1]/max*100))}%"></span></span><span class="pct">${t[1]}</span></li>`).join("");
  document.getElementById("view").innerHTML=`<div class="card">
    <div class="city-name">${d.flag} ${d.name}</div>
    ${badge}
    <div class="section-t">Vins les plus recherchés</div>
    <ol class="top">${list}</ol>
  </div>`;
}
renderChips();renderView();
fetch('./trends.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j){TRENDS=j;renderView();}}).catch(()=>{});
</script>
</body>
</html>
